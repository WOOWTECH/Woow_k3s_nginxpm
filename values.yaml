# Default values for the nginxpm chart.
# Defaults reproduce the original Kustomize deployment 1:1
# (namespace nginxpm, NodePorts 30080/30443/30081, local-path storage,
# built-in SQLite database).

namespace:
  # Create the target namespace as part of the release.
  # Set to false if the namespace is managed elsewhere.
  # Ignored (never rendered) when namespace.name equals the `-n` the release
  # was installed into: that namespace holds Helm's own release record, so it
  # must be created with `--create-namespace` instead, and `helm uninstall`
  # can then never delete the namespace the release itself lives in.
  create: true
  name: nginxpm

# Add `helm.sh/resource-policy: keep` to the Namespace and both PVCs, so
# `helm uninstall` never deletes proxy hosts, SSL certificates or the SQLite
# database. Data survives until removed by hand.
keepOnUninstall: true

tests:
  # `helm test` smoke pod: read-only HTTP checks against the admin UI (81)
  # and the HTTP proxy port (80).
  enabled: true

nginxpm:
  image:
    repository: jc21/nginx-proxy-manager
    tag: latest
    # "Always" matches the original manifests' behaviour with the
    # :latest tag (Kubernetes defaults to Always for :latest).
    pullPolicy: Always

  service:
    type: NodePort
    # HTTP proxy traffic (reverse-proxied hosts).
    http:
      port: 80
      nodePort: 30080
    # HTTPS proxy traffic (SSL-terminated reverse-proxied hosts).
    https:
      port: 443
      nodePort: 30443
    # Admin UI (web-based management console).
    admin:
      port: 81
      nodePort: 30081

  persistence:
    # PVC for NPM configuration, proxy hosts, access lists, and the
    # built-in SQLite database.
    data:
      storageClassName: local-path
      size: 5Gi
    # PVC for Let's Encrypt SSL certificates and ACME account data.
    letsencrypt:
      storageClassName: local-path
      size: 1Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
