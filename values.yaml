# Default values for the nginxpm chart.
# Defaults reproduce the original Kustomize deployment 1:1
# (namespace nginxpm, NodePorts 30080/30443/30081, local-path storage,
# built-in SQLite database).

namespace:
  # Create the target namespace as part of the release.
  # Set to false if the namespace is managed elsewhere.
  # Ignored (never rendered) when namespace.name equals the `-n` the release
  # was installed into: that namespace holds Helm's own release record, so it
  # must be created with `--create-namespace` instead, and `helm uninstall`
  # can then never delete the namespace the release itself lives in.
  create: true
  # EMPTY BY DEFAULT so `-n` controls placement. A non-empty value here
  # silently overrides `-n`, which is how a rehearsal once wrote Helm ownership
  # annotations onto a live production Deployment. Set it only when you
  # deliberately want objects somewhere other than the release namespace.
  name: ""

# Add `helm.sh/resource-policy: keep` to the Namespace and both PVCs, so
# `helm uninstall` never deletes proxy hosts, SSL certificates or the SQLite
# database. Data survives until removed by hand.
keepOnUninstall: true

tests:
  # `helm test` smoke pod: read-only HTTP checks against the admin UI (81)
  # and the HTTP proxy port (80).
  enabled: true

# Name of the Deployment, Service, both PVCs, the pod label and the SELECTOR.
# The selector is immutable on a live Deployment, so this must match whatever is
# already running: the instance in namespace `nginxpm` is called `nginxpm`, the
# one in `pi-agent-woow` is called `npm`.
baseName: nginxpm

nginxpm:
  # Container name inside the pod. Defaults to baseName.
  containerName: ""
  # null leaves the field unset (what the nginxpm instance has); the
  # pi-agent-woow instance sets it to false and that is part of its pod template.
  automountServiceAccountToken: null
  # Env on the container. The pi-agent-woow instance sets DISABLE_IPV6.
  env: []
  # Container ports. NAMES and ORDER are part of the pod template, and the two
  # live instances differ on both, so this is data rather than fixed template.
  ports:
    - name: http
      containerPort: 80
      protocol: TCP
    - name: https
      containerPort: 443
      protocol: TCP
    - name: admin-ui
      containerPort: 81
      protocol: TCP
  # Probes, verbatim. Defaults reproduce the original nginxpm manifests.
  livenessProbe:
    httpGet:
      path: /
      port: admin-ui
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /
      port: admin-ui
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  image:
    repository: jc21/nginx-proxy-manager
    tag: latest
    # "Always" matches the original manifests' behaviour with the
    # :latest tag (Kubernetes defaults to Always for :latest).
    pullPolicy: Always

  service:
    type: NodePort
    # Explicit Service port list. Empty keeps the original three-port shape
    # built from http/https/admin below; set it when an instance publishes a
    # different set (the pi-agent-woow one has no HTTPS port).
    ports: []
    # HTTP proxy traffic (reverse-proxied hosts).
    http:
      port: 80
      nodePort: 30080
    # HTTPS proxy traffic (SSL-terminated reverse-proxied hosts).
    https:
      port: 443
      nodePort: 30443
    # Admin UI (web-based management console).
    admin:
      port: 81
      nodePort: 30081

  persistence:
    # PVC for NPM configuration, proxy hosts, access lists, and the
    # built-in SQLite database.
    data:
      storageClassName: local-path
      size: 5Gi
    # PVC for Let's Encrypt SSL certificates and ACME account data.
    letsencrypt:
      storageClassName: local-path
      size: 1Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
