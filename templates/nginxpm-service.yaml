---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginxpm.name" . }}
  namespace: {{ include "nginxpm.ns" . }}
  labels:
    app: {{ include "nginxpm.name" . }}
spec:
  type: {{ .Values.nginxpm.service.type }}
  selector:
    app: {{ include "nginxpm.name" . }}
  ports:
  {{- if .Values.nginxpm.service.ports }}
  {{- /*
  Explicit port list, verbatim. The second live instance publishes only two
  ports (no HTTPS) and names the admin one differently, which the three fixed
  blocks below cannot express.
  */}}
    {{- toYaml .Values.nginxpm.service.ports | nindent 4 }}
  {{- else }}
    - name: http
      port: {{ .Values.nginxpm.service.http.port }}
      targetPort: http
      {{- if eq .Values.nginxpm.service.type "NodePort" }}
      nodePort: {{ .Values.nginxpm.service.http.nodePort }}
      {{- end }}
      protocol: TCP
    - name: https
      port: {{ .Values.nginxpm.service.https.port }}
      targetPort: https
      {{- if eq .Values.nginxpm.service.type "NodePort" }}
      nodePort: {{ .Values.nginxpm.service.https.nodePort }}
      {{- end }}
      protocol: TCP
    - name: admin-ui
      port: {{ .Values.nginxpm.service.admin.port }}
      targetPort: admin-ui
      {{- if eq .Values.nginxpm.service.type "NodePort" }}
      nodePort: {{ .Values.nginxpm.service.admin.nodePort }}
      {{- end }}
      protocol: TCP
  {{- end }}
