---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nginxpm.name" . }}
  namespace: {{ include "nginxpm.ns" . }}
  labels:
    app: {{ include "nginxpm.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "nginxpm.name" . }}
  strategy:
    type: Recreate          # single-writer for the SQLite database
  template:
    metadata:
      labels:
        app: {{ include "nginxpm.name" . }}
    spec:
      {{- if not (kindIs "invalid" .Values.nginxpm.automountServiceAccountToken) }}
      automountServiceAccountToken: {{ .Values.nginxpm.automountServiceAccountToken }}
      {{- end }}
      containers:
        - name: {{ .Values.nginxpm.containerName | default (include "nginxpm.name" .) }}
          image: "{{ .Values.nginxpm.image.repository }}:{{ .Values.nginxpm.image.tag }}"
          imagePullPolicy: {{ .Values.nginxpm.image.pullPolicy }}
          {{- with .Values.nginxpm.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /*
          Port NAMES and their ORDER are part of the pod template, so a takeover
          that renames or reorders them restarts the pod even though nothing
          about the container changed. The live instances disagree on both.
          */}}
          ports:
            {{- toYaml .Values.nginxpm.ports | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: letsencrypt
              mountPath: /etc/letsencrypt
          resources:
            {{- toYaml .Values.nginxpm.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.nginxpm.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.nginxpm.readinessProbe | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "nginxpm.name" . }}-data
        - name: letsencrypt
          persistentVolumeClaim:
            claimName: {{ include "nginxpm.name" . }}-letsencrypt
