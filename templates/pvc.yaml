---
# PVC for NPM data (config, proxy hosts, access lists, SQLite database)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nginxpm.name" . }}-data
  namespace: {{ include "nginxpm.ns" . }}
  labels:
    app: {{ include "nginxpm.name" . }}
  {{- include "nginxpm.keepAnnotations" . | nindent 2 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.nginxpm.persistence.data.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.nginxpm.persistence.data.size }}
---
# PVC for Let's Encrypt SSL certificates
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nginxpm.name" . }}-letsencrypt
  namespace: {{ include "nginxpm.ns" . }}
  labels:
    app: {{ include "nginxpm.name" . }}
  {{- include "nginxpm.keepAnnotations" . | nindent 2 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.nginxpm.persistence.letsencrypt.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.nginxpm.persistence.letsencrypt.size }}
